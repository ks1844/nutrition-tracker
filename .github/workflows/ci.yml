name: CI

# バックエンド（ビルド・テスト）とフロントエンド（ビルド・テスト）を検証する。
# バックエンドの API テストは Testcontainers で MySQL 8.4 を起動するため、Docker が使える ubuntu-latest で実行する。
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: バックエンド（.NET）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: ビルド
        run: dotnet build --configuration Release
      - name: テスト（Domain / API）
        run: dotnet test --configuration Release --no-build

  frontend:
    name: フロントエンド（Angular）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 依存関係のインストール
        run: npm ci
      - name: ビルド
        run: npm run build
      - name: テスト
        run: npm test -- --watch=false
