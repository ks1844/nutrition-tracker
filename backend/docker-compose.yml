# ローカル開発用の MySQL（ポート 3306 固定）。起動: docker compose up -d
# 認証情報は .env から読む（.env はコミットしない。雛形は .env.example）。
services:
  db:
    image: mysql:8.4
    container_name: nutritiontracker-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env に MYSQL_ROOT_PASSWORD を設定してください}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nutritiontracker}
      MYSQL_USER: ${MYSQL_USER:-nutrition}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env に MYSQL_PASSWORD を設定してください}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
