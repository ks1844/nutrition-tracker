@if (pfc(); as p) {
  <div
    class="flex h-4 overflow-hidden rounded-full border border-white/80 shadow-inner"
    role="img"
    [attr.aria-label]="
      'PFC比 タンパク質' +
      p.ratioPct.p +
      '% 脂質' +
      p.ratioPct.f +
      '% 炭水化物' +
      p.ratioPct.c +
      '%'
    "
  >
    <div
      class="h-full"
      style="background: linear-gradient(90deg, #a78bfa, #7c3aed)"
      [style.width.%]="p.ratioPct.p"
    ></div>
    <div
      class="h-full"
      style="background: linear-gradient(90deg, #fcd34d, #f59e0b)"
      [style.width.%]="p.ratioPct.f"
    ></div>
    <div
      class="h-full"
      style="background: linear-gradient(90deg, #7dd3fc, #0ea5e9)"
      [style.width.%]="p.ratioPct.c"
    ></div>
  </div>
  <ul class="m-0 mt-2 grid list-none grid-cols-3 gap-2 p-0 text-center">
    <li class="glass-inset px-1 py-1.5">
      <div class="text-[0.72rem] font-extrabold" style="color: #6d28d9">P タンパク質</div>
      <div class="tabnum text-[0.95rem] font-extrabold">{{ fmt(p.proteinG) }}g</div>
      <div class="tabnum muted text-[0.72rem] font-bold">{{ p.ratioPct.p }}%</div>
    </li>
    <li class="glass-inset px-1 py-1.5">
      <div class="text-[0.72rem] font-extrabold" style="color: #b45309">F 脂質</div>
      <div class="tabnum text-[0.95rem] font-extrabold">{{ fmt(p.fatG) }}g</div>
      <div class="tabnum muted text-[0.72rem] font-bold">{{ p.ratioPct.f }}%</div>
    </li>
    <li class="glass-inset px-1 py-1.5">
      <div class="text-[0.72rem] font-extrabold" style="color: #0369a1">C 炭水化物</div>
      <div class="tabnum text-[0.95rem] font-extrabold">{{ fmt(p.carbG) }}g</div>
      <div class="tabnum muted text-[0.72rem] font-bold">{{ p.ratioPct.c }}%</div>
    </li>
  </ul>
}
