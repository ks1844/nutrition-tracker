<nav
  class="glass-strong fixed inset-x-3 bottom-3 z-40 mx-auto max-w-lg !rounded-[1.6rem] px-1.5 py-1.5 pb-[max(0.375rem,env(safe-area-inset-bottom))]"
  aria-label="メインメニュー"
>
  <ul class="m-0 grid list-none grid-cols-5 gap-1 p-0">
    @for (t of tabs; track t.path) {
      <li>
        <a
          [routerLink]="t.path"
          routerLinkActive="nav-active"
          [routerLinkActiveOptions]="{ exact: t.exact }"
          class="nav-item flex min-h-[3.25rem] flex-col items-center justify-center gap-0.5 rounded-2xl text-[0.68rem] font-extrabold text-inherit no-underline"
        >
          <app-icon [name]="t.icon" [size]="21" />
          {{ t.label }}
        </a>
      </li>
    }
  </ul>
</nav>
